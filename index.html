<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <meta name="theme-color" content="#111318">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MOB BR</title>
  <link rel="stylesheet" href="./css/main.css?v=27">
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite"></div>

  <div
    id="loadingOverlay"
    class="loading-overlay"
    role="status"
    aria-live="assertive"
    aria-hidden="false"
  >
    <div class="loading-overlay__shade"></div>
    <div class="loading-overlay__content">
      <p class="loading-overlay__title">MOB BR</p>
      <p id="loadingMessage" class="loading-overlay__message">LOADING...</p>
      <span class="loading-overlay__spinner" aria-hidden="true"></span>
    </div>
  </div>

  <div id="modalRoot" class="modal-root" aria-live="assertive"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <noscript>
    <p class="noscript-message">MOB BRを起動するにはJavaScriptを有効にしてください。</p>
  </noscript>

  <script type="module" src="./js/main/app.js?v=27"></script>
</body>
</html>
