<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <meta name="theme-color" content="#090b10">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MOB BR Tournament</title>
  <link rel="stylesheet" href="./css/tournament.css?v=51">
</head>
<body>
  <div id="tournamentApp" class="tournament-shell" aria-live="polite"></div>

  <div
    id="tournamentLoadingOverlay"
    class="tournament-loading-overlay"
    role="status"
    aria-live="assertive"
    aria-hidden="false"
  >
    <div class="tournament-loading-overlay__shade"></div>
    <div class="tournament-loading-overlay__content">
      <p>MOB BR</p>
      <strong id="tournamentLoadingMessage">LOADING...</strong>
      <span class="tournament-spinner" aria-hidden="true"></span>
    </div>
  </div>

  <div id="tournamentModalRoot" class="tournament-modal-root"></div>
  <div id="tournamentToastRoot" class="tournament-toast-root" aria-live="polite"></div>

  <noscript>
    <p class="noscript-message">大会システムを起動するにはJavaScriptを有効にしてください。</p>
  </noscript>

  <script type="module" src="./js/tournament/flow.js?v=51"></script>
</body>
</html>
