<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOB BR｜CPUチームエディター</title><link rel="stylesheet" href="css/cpu-editor.css?v=3"></head>
<body><header class="app-header"><div><span>MOB BR / TEAM STUDIO</span><h1>CPUチームエディター</h1><p>画像を見ながら、名前と強さをカスタマイズ。</p></div><a href="index.html">ゲームへ戻る ↗</a></header>
<div class="workspace"><aside><label for="search">チーム・キャラを検索</label><input id="search" type="search" placeholder="名前で検索"><label for="league">大会</label><select id="league"><option value="">すべての大会</option><option value="local">LOCAL</option><option value="national">NATIONAL</option><option value="world">WORLD</option><option value="denden">デンデンカップ</option></select><p id="teamCount"></p><nav id="teamList" aria-label="CPUチーム一覧"></nav></aside>
<main><section class="notice"><strong>CPU専用 / プレイヤーチームは変更しません</strong><p>保存した設定は、このブラウザ・同じURLのゲームで、新しく開始する大会に反映されます。ゲームを開いている場合は再読み込みしてください。進行中の大会はそのまま継続します。</p></section><div id="editor"></div><div class="save-bar"><span id="dirtyState">変更なし</span><button id="reset" class="sub">このチームを初期値に戻す</button><button id="save" class="primary" disabled>変更を保存</button></div><p id="status" role="status" aria-live="polite"></p><section class="file-tools"><h2>設定ファイル</h2><p>保存済みのCPU設定をバックアップ。他のブラウザでも読み込めます。</p><button id="export">書き出す</button><button id="importButton">読み込む</button><input id="import" type="file" accept="application/json,.json" hidden></section></main></div>
<script defer src="js/cpu-editor.bundle.js?v=3"></script></body></html>
